display: ":0"
xauthority: "~/.Xauthority"

legacy_compatibility: true

global:
  retry:
    - "--sleep=1"
    - "--tries=100"
  sub-system:
    ska-tango-util:
      enabled: false
    ska-tango-base:
      enabled: false
    ska-tango-taranta:
      enabled: false
  tango_host: databaseds-tango-base-test:10000
  dsconfig:
    timeout: 300s
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.5.7
      pullPolicy: IfNotPresent
  itango:
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-itango
      tag: 9.3.10
      pullPolicy: IfNotPresent
  cluster_domain: cluster.local

  ska-tango-examples:
    enabled: false
  replicas: 1
  resources:
    requests:
      cpu: 200m # 200m = 0.2 CPU
      memory: 200Mi # 200Mi = 0.2 GB mem
    limits:
      memory: 1024Mi # 1024Mi = 1 GB mem

ska-tango-base:
  enabled: true
  vnc:
    replicas: 1
    enabled: false
  tangorest:
    enabled: true
    replicas: 1
  tangodb:
    use_pv: false

# TMC-low
tmc-low:
  labels:
    app: ska-tmc-low-integration
  enabled: true

  deviceServers:
    centralnode:
      LoggingLevel: "5"

    subarraynode:
      LoggingLevel: "5"

    sdpsubarrayleafnode:
      LoggingLevel: "5"

    sdpmasterleafnode:
      LoggingLevel: "5"

    cspmasterleafnode:
      LoggingLevel: "5"

    cspsubarrayleafnode:
      LoggingLevel: "5"

    mccssubarrayleafnode:
      LoggingLevel: "5"

    mccsmasterleafnode:
      LoggingLevel: "5"

# SKUID
ska-ser-skuid:
  labels:
    app: ska-tmc-low-integration
  enabled: true
  skuid:
    use_pv: false
    config:
      generator_id: mvp01

ska-tango-taranta:
  enabled: false
  tangogql:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 200Mi

ska-tango-tangogql:
  enabled: false
  ska-tango-base:
    enabled: false

ska-tmc-simulators:
  enabled: true
  subarray_count: 16
  telescope: SKA-low
  deviceServers:
    mocks:
      enabled: true
      LoggingLevel: "5"
  ska_tmc_simulators:
    image:
      registry: registry.gitlab.com/ska-telescope/ska-tmc/ska-tmc-simulators
      tag: 1.13.0-dev.c32729cee
