name: "mccsmasterleafnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
entrypoints:
  - name: "ska_tmc_mccsmasterleafnode.mccs_master_leaf_node.MccsMasterLeafNode"
server:
  name: "mccs_master_leaf_node"
  instances:
  - name: "01"
    classes:
    - name: "MccsMasterLeafNode"
      devices:
      - name: "ska_low/tm_leaf_node/mccs_master"
        properties:
        - name: "MccsMasterFQDN"
          values:
          - "{{.Values.global.mccs_master}}"
        - name: "SkaLevel"
          values:
          - "3"
        - name: "LoggingTargetsDefault"
          values:
          - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
          - "5"
        - name: "LivelinessCheckPeriod"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.LivelinessCheckPeriod}}"
        - name: "EventSubscriptionCheckPeriod"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.EventSubscriptionCheckPeriod}}"
        - name: "AdapterTimeOut"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.AdapterTimeOut}}"
        - name: "CommandTimeOut"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.CommandTimeOut}}"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.mccsmasterleafnode.image.registry}}"
  image: "{{.Values.mccsmasterleafnode.image.image}}"
  tag: "{{.Values.mccsmasterleafnode.image.tag}}"
  pullPolicy: "{{.Values.mccsmasterleafnode.image.pullPolicy}}"
