name: "mccsmasterleafnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
entrypoints:
  - name: "ska_tmc_mccsmasterleafnode.mccs_master_leaf_node.LowTmcLeafNodeMccs"
server:
  name: "mccs_master_leaf_node"
  instances:
  {{ $domain := .Values.domain}}
  {{ $family := .Values.deviceServers.mccsmasterleafnode.family }}
  {{ $member := .Values.deviceServers.mccsmasterleafnode.member }}
  - name: "01"
    classes:
    - name: "LowTmcLeafNodeMccs"
      devices:
      - name: "{{ $domain }}/{{ $family }}/{{ $member }}"
        properties:
        - name: "MccsMasterFQDN"
          values:
          - "{{.Values.devices_fqdn.mccs_master}}"
        - name: "SkaLevel"
          values:
          - "3"
        - name: "LoggingTargetsDefault"
          values:
          - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
          - "{{coalesce $.Values.deviceServers.centralnode.LoggingLevel $.Values.global.TMCLoggingLevel }}"
        - name: "LivelinessCheckPeriod"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.LivelinessCheckPeriod}}"
        - name: "EventSubscriptionCheckPeriod"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.EventSubscriptionCheckPeriod}}"
        - name: "AdapterTimeOut"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.AdapterTimeOut}}"
        - name: "CommandTimeOutDefault"
          values:
          - "{{.Values.deviceServers.mccsmasterleafnode.CommandTimeOutDefault}}"
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.mccsmasterleafnode.image.registry}}"
  image: "{{.Values.mccsmasterleafnode.image.image}}"
  tag: "{{.Values.mccsmasterleafnode.image.tag}}"
  pullPolicy: "{{.Values.mccsmasterleafnode.image.pullPolicy}}"
