name: "cspsubarrayleafnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
entrypoints:
  - name: "ska_tmc_cspsubarrayleafnode.csp_subarray_leaf_node_low.LowTmcLeafNodeCspSubarray"
{{- $TelmodelSource := .Values.deviceServers.cspsubarrayleafnode.TelmodelSource }}
{{- $TelmodelPath := .Values.deviceServers.cspsubarrayleafnode.TelmodelPath }}
{{- $DelayModelTimeInAdvance := .Values.deviceServers.cspsubarrayleafnode.DelayModelTimeInAdvance }}
{{- $DelayCadence := .Values.deviceServers.cspsubarrayleafnode.DelayCadence }}
{{- $DelayValidityPeriod := .Values.deviceServers.cspsubarrayleafnode.DelayValidityPeriod }}
{{- $PSTDelayModelTimeInAdvance := .Values.deviceServers.cspsubarrayleafnode.PSTDelayModelTimeInAdvance }}
{{- $PSTDelayCadence := .Values.deviceServers.cspsubarrayleafnode.PSTDelayCadence }}
{{- $PSTDelayValidityPeriod := .Values.deviceServers.cspsubarrayleafnode.PSTDelayValidityPeriod }}
{{- $PSSDelayModelTimeInAdvance := .Values.deviceServers.cspsubarrayleafnode.pss.delay_model_time_in_advance }}
{{- $PSSDelayCadence := .Values.deviceServers.cspsubarrayleafnode.pss.delay_cadence }}
{{- $PSSDelayValidityPeriod := .Values.deviceServers.cspsubarrayleafnode.pss.delay_validity_period }}
{{- $CommandTimeOutDefault := .Values.deviceServers.cspsubarrayleafnode.CommandTimeOutDefault }}
{{- $AdapterTimeOut := .Values.deviceServers.cspsubarrayleafnode.AdapterTimeOut }}
{{- $LivelinessCheckPeriod := .Values.deviceServers.cspsubarrayleafnode.LivelinessCheckPeriod }}
{{- $EventSubscriptionCheckPeriod := .Values.deviceServers.cspsubarrayleafnode.EventSubscriptionCheckPeriod }}
{{ $domain := .Values.domain}}
{{ $family := .Values.deviceServers.cspsubarrayleafnode.family }}
server:
  name: "csp_subarray_leaf_node_low"
  instances:
  {{ $csp_sa_fqdn_prefix:= .Values.devices_fqdn.csp_subarray_prefix}}
  {{- range  ( regexSplit " " ((.Values.global.subarray_count | int) | seq ) -1 ) }}
    - name: "{{ printf "%02s" . }}"
      classes:
      - name: "LowTmcLeafNodeCspSubarray"
        devices:
          - name: "{{ $domain }}/{{ $family }}/{{ printf "%02s" . }}"
            properties:
              - name: "TelmodelSource"
                values:
                - "{{ $TelmodelSource }}"
              - name: "TelmodelPath"
                values:
                - "{{ $TelmodelPath }}"
              - name: "CspSubarrayFQDN"
                values:
                - "{{ $csp_sa_fqdn_prefix }}/{{ printf "%02s" . }}"
              - name: "SkaLevel"
                values:
                - "3"
              - name: "LoggingTargetsDefault"
                values:
                - "tango::logger"
              - name: "LoggingLevelDefault"
                values:
                - "{{coalesce $.Values.deviceServers.centralnode.LoggingLevel $.Values.global.TMCLoggingLevel }}"
              - name: "DelayModelTimeInAdvance"
                values:
                - "{{ $DelayModelTimeInAdvance }}"
              - name: "DelayCadence"
                values:
                - "{{ $DelayCadence }}"
              - name: "DelayValidityPeriod"
                values:
                - "{{ $DelayValidityPeriod }}"
              - name: "PSTDelayModelTimeInAdvance"
                values:
                - "{{ $PSTDelayModelTimeInAdvance }}"
              - name: "PSTDelayCadence"
                values:
                - "{{ $PSTDelayCadence }}"
              - name: "PSTDelayValidityPeriod"
                values:
                - "{{ $PSTDelayValidityPeriod }}"
              - name: "PSSDelayModelTimeInAdvance"
                values:
                - "{{ $PSSDelayModelTimeInAdvance }}"
              - name: "PSSDelayCadence"
                values:
                - "{{ $PSSDelayCadence }}"
              - name: "PSSDelayValidityPeriod"
                values:
                - "{{ $PSSDelayValidityPeriod }}"
              - name: "CommandTimeOutDefault"
                values:
                - "{{ $CommandTimeOutDefault }}"
              - name: "LivelinessCheckPeriod"
                values:
                - "{{ $LivelinessCheckPeriod }}"
              - name: "EventSubscriptionCheckPeriod"
                values:
                - "{{ $EventSubscriptionCheckPeriod }}"
              - name: "AdapterTimeOut"
                values:
                - "{{ $AdapterTimeOut }}"
  {{- end}}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.cspsubarrayleafnode.image.registry}}"
  image: "{{.Values.cspsubarrayleafnode.image.image}}"
  tag: "{{.Values.cspsubarrayleafnode.image.tag}}"
  pullPolicy: "{{.Values.cspsubarrayleafnode.image.pullPolicy}}"

{{- with $.Values.astroDataVolume }}
extraVolumes:
- name: astro-data
  persistentVolumeClaim:
    claimName: {{.}}
extraVolumeMounts:
  - name: astro-data
    mountPath: /root/.astropy
    readOnly: true
{{- end}}