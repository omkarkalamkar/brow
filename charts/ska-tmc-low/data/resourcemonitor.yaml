name: "resourcemonitor-test"
function: telescope-monitoring
domain: resource-monitoring
instances: ["01"]
entrypoints:
  - name: "ska_tmc_resource_monitor.resource_monitor_low.LowResourceMonitor"

{{- $LivelinessCheckPeriod := .Values.deviceServers.resourcemonitor.LivelinessCheckPeriod }}
{{- $EventSubscriptionCheckPeriod := .Values.deviceServers.resourcemonitor.EventSubscriptionCheckPeriod }}
{{- $Domain := .Values.domain }}
{{- $Family := .Values.deviceServers.resourcemonitor.family }}
{{- $count := .Values.global.subarray_count}}
{{- $subarray_family:= .Values.deviceServers.subarraynode.family}}
{{- $mccs_controller := .Values.devices_fqdn.mccs_master}}
command: "python3 /app/src/ska_tmc_resource_monitor/resource_monitor_low.py"
server:
  name: "resource_monitor_low"
  instances:
  {{ $resource_monitor_fqdn_prefix:= .Values.devices_fqdn.resource_monitor_prefix}}
  {{- range  .Values.deviceServers.resourcemonitor.instances }}
    - name: "{{ . }}"
      classes:
      - name: "LowResourceMonitor"
        devices:
        - name: "{{ $Domain }}/{{ $Family }}/{{ . }}"
          properties:
            - name: "LowSubarrayNodeFQDNs"
              values:
              {{- range  ( regexSplit " " (($count | int) | seq ) -1 ) }}
                - "{{ $Domain }}/{{ $subarray_family }}/{{ printf "%02s" . }}"
              {{- end}}
            - name: "MCCSControllerFQDN"
              values:
                - "{{$mccs_controller}}"

  {{- end}}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.resource_monitor.image.registry}}"
  image: "{{.Values.resource_monitor.image.image}}"
  tag: "{{.Values.resource_monitor.image.tag}}"
  pullPolicy: "{{.Values.resource_monitor.image.pullPolicy}}"
