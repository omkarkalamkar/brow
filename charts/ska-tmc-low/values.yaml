display: ":0"
xauthority: "~/.Xauthority"

enabled: true

legacy_compatibility: true

system: TM-low
telescope: SKA-low
subsystem: ska-tmc-low

labels:
  app: ska-tmc-low
annotations:
  app.gitlab.com/app: CI_PROJECT_PATH_SLUG
  app.gitlab.com/env: CI_ENVIRONMENT_SLUG
Values.astroDataVolume: ~
global:
  minikube: false
  astroDataClaim: ~
  tango_host: databaseds-tango-base-test:10000
  #  .Values.global.subarray_count
  # subarray_count, this will be expanded (1 to N inclusive)
  subarray_count: 1
  TMCLoggingLevel: "4"

domain: "low-tmc"
##  Order of instances resolution ##
# .Values.deviceServers.<device>.instances
# File, data/<device>.yaml, instances
# deviceServers.cspsubarrayleafnode, deviceServers.sdpsubarrayleafnode,
# deviceServers.subarraynode , deviceServers.mccssubarrayleafnode
subarray_devices:
  - "cspsubarrayleafnode"
  - "sdpsubarrayleafnode"
  - "subarraynode"
  - "mccssubarrayleafnode"

# FQDN details are specific to TMC, shouldn't be overridden in global unless
#  absolutely necessary.
devices_fqdn:
  tmc_subarray_prefix: "low-tmc/subarray"
  csp_subarray_ln_prefix: "low-tmc/subarray-leaf-node-csp/"
  sdp_subarray_ln_prefix: "low-tmc/subarray-leaf-node-sdp/"
  csp_master_ln: "low-tmc/leaf-node-csp/0"
  sdp_master_ln: "low-tmc/leaf-node-sdp/0"
  mccs_master_ln: "low-tmc/leaf-node-mccs/0"
  csp_subarray_prefix: "low-csp/subarray"
  sdp_subarray_prefix: "low-sdp/subarray"
  csp_master: "low-csp/control/0"
  sdp_master: "low-sdp/control/0"
  mccs_master: "low-mccs/control/control"
  mccs_subarray_ln_prefix: "low-tmc/subarray-leaf-node-mccs/"
  mccs_subarray_prefix: "low-mccs/subarray"
  resource_monitor_prefix: "low-tmc/resource-monitor/"

dsconfig:
  configuration_file: data/tmc-low-config.json
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-dsconfig
    tag: 1.5.7
    pullPolicy: IfNotPresent

itango:
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-itango
    tag: 9.3.10
    pullPolicy: IfNotPresent

centralnode:
  image:
    registry: artefact.skao.int
    image: ska-tmc-centralnode
    tag: 1.1.0
    pullPolicy: IfNotPresent

subarraynode:
  image:
    registry: artefact.skao.int
    image: ska-tmc-subarraynode
    tag: 1.4.0
    pullPolicy: IfNotPresent

sdpleafnodes:
  image:
    registry: artefact.skao.int
    image: ska-tmc-sdpleafnodes
    tag: 0.29.0
    pullPolicy: IfNotPresent

cspmasterleafnode:
  image:
    registry: artefact.skao.int
    image: ska-tmc-cspleafnodes
    tag: 0.43.0
    pullPolicy: IfNotPresent

cspsubarrayleafnode:
  image:
    registry: artefact.skao.int
    image: ska-tmc-cspleafnodes
    tag: 0.43.0
    pullPolicy: IfNotPresent

mccsmasterleafnode:
  image:
    registry: registry.gitlab.com/ska-telescope/ska-tmc/ska-tmc-mccsleafnodes
    image: ska-tmc-mccsleafnodes
    tag:  0.15.1-dev.ce4985961
    pullPolicy: IfNotPresent

mccssubarrayleafnode:
  image:
    registry: registry.gitlab.com/ska-telescope/ska-tmc/ska-tmc-mccsleafnodes
    image: ska-tmc-mccsleafnodes
    tag:  0.15.1-dev.ce4985961
    pullPolicy: IfNotPresent

resource_monitor:
  image:
    registry: artefact.skao.int
    image: ska-tmc-resource-monitor
    tag: 0.5.0
    pullPolicy: IfNotPresent

skatmcsimulators:
  image:
    registry: artefact.skao.int
    image: ska-tmc-simulators
    tag: 1.9.7
    pullPolicy: IfNotPresent

resources:
  limits:
    memory: 500Mi
  requests:
    cpu: 200m
    memory: 200Mi

deviceServers:
  centralnode:
    enabled: true
    instances: ["01"]
    file: "data/centralnode.yaml"
    SkuidService: "ska-ser-skuid-test-svc.ska-tmc-centralnode.svc.techops.internal.skao.int:9870"
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    CommandTimeOutDefault: 80
    AssignResourcesInterface: "https://schema.skao.int/ska-low-tmc-assignresources/4.0"
    ReleaseResourcesInterface: "https://schema.skao.int/ska-low-tmc-releaseresources/3.0"
    family: "central-node"
    member: "0"
    IsAutoRecoveryEnabled: "true"
    DefaultArrayLayoutSourceURIs: "gitlab://gitlab.com/ska-telescope/ska-telmodel-data?main#tmdata"
    DefaultArrayLayoutPath: "instrument/ska1_low/layout/low-layout.json"
    LoggingLevel: "4"

  subarraynode:
    enabled: true
    file: "data/subarraynode.yaml"
    CspAssignResourcesInterfaceURL: "https://schema.skao.int/ska-low-csp-assignresources/3.0"
    CspScanInterfaceURL: "https://schema.skao.int/ska-low-csp-scan/3.2"
    SdpScanInterfaceURL: "https://schema.skao.int/ska-sdp-scan/1.1"
    MccsConfigureInterfaceURL: "https://schema.skao.int/ska-low-mccs-configure/1.0"
    MccsScanInterfaceURL: "https://schema.skao.int/ska-low-mccs-scan/3.0"
    JonesURI: "tango://jones.skao.int/low/stn-beam/1"
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    CommandTimeOutDefault: 70
    AbortCommandTimeOut: 60
    family: "subarray"
    IsAutoRecoveryEnabled: "true"
    TelmodelSource: "car://gitlab.com/ska-telescope/ska-telmodel-data?main#tmdata"
    TelmodelPath: "instrument/ska1_low/layout/low-layout.json"
    MccsReleaseInterfaceURL: "https://schema.skatelescope.org/ska-low-mccs-controller-release/2.0"
    ScanStartTimeOffset: 10
    StartTimeEnabled: false
    LoggingLevel: "4"
    PreRecoveryCheckTimeDuration: 1.0
  
  sdpsubarrayleafnode:
    enabled: true
    file: "data/sdpsubarrayleafnode.yaml"
    CommandTimeOutDefault: 50
    AdapterTimeOut: 2
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    SDPSubarrayAdminModeEnabled: true
    family: "subarray-leaf-node-sdp"
    LoggingLevel: "4"

  sdpmasterleafnode:
    enabled: true
    instances: ["01"]
    file: "data/sdpmasterleafnode.yaml"
    AdapterTimeOut: 2
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    SDPMasterAdminModeEnabled: true
    family: "leaf-node-sdp"
    member: "0"
    LoggingLevel: "4"

  cspmasterleafnode:
    enabled: true
    instances: ["01"]
    file: "data/cspmasterleafnode.yaml"
    AdapterTimeOut: 2.0
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    family: "leaf-node-csp"
    member: "0"
    LoggingLevel: "4"

  mccsmasterleafnode:
    enabled: true
    instances: ["01"]
    file: "data/mccsmasterleafnode.yaml"
    CommandTimeOutDefault: 50
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    AdapterTimeOut: 2.0
    family: "leaf-node-mccs"
    member: "0"
    LoggingLevel: "4"

  cspsubarrayleafnode:
    enabled: true
    file: "data/cspsubarrayleafnode.yaml"
    TelmodelSource: gitlab://gitlab.com/ska-telescope/ska-telmodel-data?main#tmdata
    TelmodelPath: instrument/ska1_low/layout/low-layout.json
    DelayCadence: 300.0
    DelayValidityPeriod: 600.0
    DelayModelTimeInAdvance: 0
    PSTDelayCadence: 300.0
    PSTDelayValidityPeriod: 600.0
    PSTDelayModelTimeInAdvance: 0
    pss:
      delay_cadence: 300.0
      delay_validity_period: 600.0
      delay_model_time_in_advance: 0
    CommandTimeOutDefault: 50
    AdapterTimeOut: 2.0
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    family: "subarray-leaf-node-csp"
    LoggingLevel: "4"

  mccssubarrayleafnode:
    enabled: true
    file: "data/mccssubarrayleafnode.yaml"
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    CommandTimeOutDefault: 50
    AdapterTimeOut: 2.0
    family: "subarray-leaf-node-mccs"
    LoggingLevel: "4"

  resourcemonitor:
    enabled: true
    instances: ["01"]
    file: "data/resourcemonitor.yaml"
    LivelinessCheckPeriod: 0.5
    EventSubscriptionCheckPeriod: 0.5
    family: "resource-monitor"
    LoggingLevel: "4"

nodeSelector: {}

affinity: {}

tolerations: []
